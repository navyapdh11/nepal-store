<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO Meta Tags -->
    <title>NEPAL STORE | Authentic Nepalese Fashion — Cashmere, Dhaka & Traditional Wear</title>
    <meta name="description" content="Shop authentic Nepalese clothing online — handcrafted cashmere pashminas, Dhaka textiles, traditional wear, and modern fashion. Direct from Kathmandu artisans. Free shipping over रू 5,000." />
    <meta name="keywords" content="Nepalese clothing, cashmere pashmina, Dhaka fabric, traditional Nepali wear, Himalayan cashmere, handmade Nepal, Kathmandu fashion" />
    <meta name="author" content="NEPAL STORE" />
    <link rel="canonical" href="https://nepal-store.onrender.com/" />

    <!-- Open Graph Tags -->
    <meta property="og:title" content="NEPAL STORE | Authentic Nepalese Fashion" />
    <meta property="og:description" content="Handcrafted cashmere, Dhaka textiles, and traditional wear from Kathmandu artisans. Free shipping over रू 5,000." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nepal-store.onrender.com/" />
    <meta property="og:image" content="https://nepal-store.onrender.com/og-image.png" />
    <meta property="og:site_name" content="NEPAL STORE" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NEPAL STORE | Authentic Nepalese Fashion" />
    <meta name="twitter:description" content="Handcrafted cashmere, Dhaka textiles, and traditional wear from Kathmandu artisans." />
    <meta name="twitter:image" content="https://nepal-store.onrender.com/og-image.png" />

    <!-- Hreflang for multilingual -->
    <link rel="alternate" hreflang="en" href="https://nepal-store.onrender.com/" />
    <link rel="alternate" hreflang="x-default" href="https://nepal-store.onrender.com/" />

    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />

    <!-- Preconnect to font providers -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical fonts -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "NEPAL STORE",
      "url": "https://nepal-store.onrender.com",
      "logo": "https://nepal-store.onrender.com/logo.png",
      "description": "Premium e-commerce platform for authentic Nepalese fashion and lifestyle products",
      "foundingLocation": "Kathmandu, Nepal",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+977-1-4XXXXXX",
        "contactType": "customer service",
        "availableLanguage": ["English", "Nepali"]
      },
      "sameAs": [
        "https://facebook.com/nepalstore",
        "https://instagram.com/nepalstore"
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "NEPAL STORE",
      "url": "https://nepal-store.onrender.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://nepal-store.onrender.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
